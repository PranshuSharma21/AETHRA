<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AETHRA • Contact Us</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
    body { background-color: #000000; color: #f5f5f7; font-family: 'Inter', sans-serif; }
    .font-mono-code { font-family: 'JetBrains Mono', monospace; }
    .top-navbar { background-color: #f8f9fa; color: #09090b; border-bottom: 1px solid #e4e4e7; }
    .nav-link-btn {
      position: relative; color: #3f3f46; font-weight: 500; padding: 0.45rem 0.9rem;
      border-radius: 0.5rem; text-decoration: none; transition: all 0.2s ease;
    }
    .nav-link-btn::after {
      content: ''; position: absolute; left: 0.9rem; right: 0.9rem; bottom: 0.2rem;
      height: 2px; background-color: #09090b; transform: scaleX(0); transition: transform 0.22s ease;
    }
    .nav-link-btn:hover { color: #09090b; background-color: rgba(0, 0, 0, 0.05); transform: translateY(-1px); }
    .nav-link-btn:hover::after, .nav-link-btn.active::after { transform: scaleX(1); }
    .nav-link-btn.active { color: #09090b; font-weight: 600; background-color: rgba(0, 0, 0, 0.06); }
  </style>
</head>
<body class="min-h-screen">
  <header class="top-navbar sticky top-0 z-40">
    <div class="max-w-[1420px] mx-auto px-4 sm:px-6 h-14 flex items-center justify-between gap-4">
      <a href="index.html" class="font-bold text-base tracking-widest text-zinc-950 uppercase" style="text-decoration:none;">AETHRA</a>
      <nav class="flex flex-wrap items-center gap-1 text-xs sm:text-sm">
        <a href="index.html" class="nav-link-btn">Home</a>
        <a href="dashboard.html" class="nav-link-btn">Dashboard</a>
        <a href="source.html" class="nav-link-btn">Data Sources</a>
        <a href="about.html" class="nav-link-btn">About Us</a>
        <a href="contact.html" class="nav-link-btn active">Contact Us</a>
      </nav>
    </div>
  </header>

  <main class="max-w-[680px] mx-auto px-4 sm:px-6 py-14 space-y-6">
    <div class="space-y-2">
      <div class="text-xs font-mono-code uppercase text-zinc-500">Contact AETHRA</div>
      <h1 class="text-3xl font-bold text-white">Share feedback or request a regional dataset</h1>
      <p class="text-sm text-zinc-400">Have a question about our satellite pipeline, regional anomaly thresholds, or API endpoints? Send us a note below.</p>
    </div>

    <form id="contact-form" class="bg-[#0a0a0a] border border-[#222222] rounded-xl p-6 space-y-4">
      <div class="space-y-1.5">
        <label for="contact-name" class="text-xs text-zinc-300 font-medium">Name</label>
        <input id="contact-name" type="text" required placeholder="Your name" class="w-full bg-[#121212] border border-[#262626] rounded-lg px-3.5 py-2 text-xs text-white focus:outline-none focus:border-zinc-500" />
      </div>
      <div class="space-y-1.5">
        <label for="contact-email" class="text-xs text-zinc-300 font-medium">Email</label>
        <input id="contact-email" type="email" required placeholder="you@example.com" class="w-full bg-[#121212] border border-[#262626] rounded-lg px-3.5 py-2 text-xs text-white focus:outline-none focus:border-zinc-500" />
      </div>
      <div class="space-y-1.5">
        <label for="contact-msg" class="text-xs text-zinc-300 font-medium">Message / Coordinates of Interest</label>
        <textarea id="contact-msg" rows="4" required placeholder="Tell us which region or satellite parameter you want to explore..." class="w-full bg-[#121212] border border-[#262626] rounded-lg p-3.5 text-xs text-white focus:outline-none focus:border-zinc-500"></textarea>
      </div>
      <button type="submit" class="px-5 py-2.5 rounded-lg bg-white text-black text-xs font-semibold hover:bg-zinc-200 transition">
        Send Message
      </button>
      <div id="contact-status" class="hidden text-xs text-emerald-400 pt-1">Message recorded for team AETHRA.</div>
    </form>
  </main>

  <script>
    document.getElementById('contact-form').addEventListener('submit', (e) => {
      e.preventDefault();
      e.target.reset();
      document.getElementById('contact-status').classList.remove('hidden');
    });
  </script>
</body>
</html>
